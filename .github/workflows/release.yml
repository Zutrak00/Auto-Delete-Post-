name: release

# Builds the no-install apps for Windows, macOS and Linux and publishes them on the Releases page.
# Either push a tag like v1.0.0, or run this workflow from the Actions tab and type a version: GitHub then
# creates the tag itself. Leave the version empty to just build and upload artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.0.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: AutoDeletePosts-Windows.zip
          - os: macos-latest
            asset: AutoDeletePosts-Mac.zip
          - os: ubuntu-latest
            asset: AutoDeletePosts-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm AutoDeletePosts.spec
      - name: Smoke-test the built app
        run: |
          exe=dist/AutoDeletePosts
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --db "$RUNNER_TEMP/smoke.db" list
      - name: Package
        run: |
          cp README.md dist/README.md
          cd dist
          case "${{ matrix.os }}" in
            windows-*) 7z a "../${{ matrix.asset }}" AutoDeletePosts.exe README.md ;;
            macos-*)   cp ../install-mac.sh . && zip -9 "../${{ matrix.asset }}" AutoDeletePosts README.md install-mac.sh ;;
            *)         tar czf "../${{ matrix.asset }}" AutoDeletePosts README.md ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Auto-Delete Posts ${{ inputs.version || github.ref_name }}
          files: |
            AutoDeletePosts-Windows.zip
            AutoDeletePosts-Mac.zip
            AutoDeletePosts-Linux.tar.gz
          body: |
            ## Mac (Apple Silicon: M1 or newer)

            Open **Terminal**, paste this line and press Enter:

            ```
            curl -fsSL https://raw.githubusercontent.com/Zutrak00/Auto-Delete-Post-/main/install-mac.sh | bash
            ```

            It installs and starts the app, and puts an **Auto-Delete Posts** launcher on your Desktop. Please don't
            double-click the app from the Mac zip below: macOS blocks apps downloaded in a browser unless the developer
            pays Apple to check them, and offers to move them to the Trash. If you already downloaded the zip, open
            its folder, type `bash ` in Terminal, drag `install-mac.sh` into the window and press Enter.

            ## Windows and Linux

            Download **AutoDeletePosts-Windows.zip** or **AutoDeletePosts-Linux.tar.gz**, unzip it and double-click
            **AutoDeletePosts**. A small window opens and the dashboard appears in your browser. Keep the window open
            while you use it. On Windows, the first launch says "Windows protected your PC": click **More info** →
            **Run anyway**.

            ## Then

            For **X** and **Instagram**, click **Open login window** and log in as usual. It's free, and needs Google
            Chrome or Microsoft Edge (Windows always has Edge).

            New accounts start in **Preview** mode, so nothing is deleted until you choose **Go Live**.
