<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Auto-Delete Posts{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #3b5bdb; --accent-text: #fff; --danger: #c92a2a; --ok: #2b8a3e; --warn: #b7791f;
    --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #98a2b3; --line: #2c323d;
      --accent: #748ffc; --accent-text: #0b0d12; --danger: #ff8787; --ok: #69db7c; --warn: #ffd43b;
      --chip: #262c37;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; gap: 20px; align-items: center; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
  header strong { font-size: 17px; margin-right: auto; }
  header nav { display: flex; gap: 16px; align-items: center; }
  header nav a { text-decoration: none; color: var(--muted); }
  header nav a:hover { color: var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  main { padding: 24px 0 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 28px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .btn { display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--text);
         padding: 7px 14px; border-radius: 7px; font: inherit; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--danger); }
  .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
  form.inline { display: inline; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--chip); font-size: 12px; }
  .chip.live { background: var(--danger); color: #fff; }
  .chip.off { opacity: .6; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  label.check { font-weight: 400; display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--text); font: inherit; }
  .help { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--card); }
  .flash.ok { border-color: var(--ok); }
  .flash.error { border-color: var(--danger); color: var(--danger); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.text { max-width: 420px; overflow-wrap: anywhere; }
  .table-wrap { overflow-x: auto; }
  .notice { border-left: 3px solid var(--warn); padding: 10px 14px; background: var(--card); border-radius: 0 8px 8px 0; margin-bottom: 14px; }
  .stat { font-size: 26px; font-weight: 700; }
</style>
</head>
<body>
<header><div class="wrap">
  <strong>🧹 Auto-Delete Posts</strong>
  <nav>
    <a href="{{ url_for('index') }}">Accounts</a>
    <a href="{{ url_for('history') }}">History</a>
    <a href="{{ url_for('settings') }}">Schedule</a>
    {% if session.authed %}
    <form class="inline" method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="btn small" type="submit">Log out</button>
    </form>
    {% endif %}
  </nav>
</div></header>
<main><div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div></main>
</body>
</html>
